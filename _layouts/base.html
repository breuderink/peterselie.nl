<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="Poppentheater Peterselie verzorgt vrolijk poppentheater in het hele land voor kinderen vanaf twee jaar.">
<meta name="keywords" content="poppentheater, poppenspel, workshop, puppetry, puppeteer, poppenspeler, theater, peuter theater, meespeeltheater, verstandelijk gehandicapten"/>
<link rel="icon" href="{{ '/files/resources/favicon.ico' | relative_url }}" type="image/x-icon">
<link rel="stylesheet" href="{{ '/files/resources/style.css' | relative_url }}">
</head>
<body>
<div id="content">
  <header id="header"></header>

  <div id="columns">
    <aside id="sidebar-left" class="sidebar">
      <div class="panel">
        {% include nav.html %}
      </div>
    </aside>

    <main id="content-left" class="main-content">
      <h2 class="content-title">{{ page.h2 }}</h2>
      {% if page.mission %}<div id="mission">{{ page.mission }}</div>{% endif %}
      <article class="node">
        <div class="content">{{ content }}</div>
      </article>
    </main>
  </div>

  <footer id="footer">ontwerp: Boris Reuderink (b.reuderink@alumnus.utwente.nl)</footer>
</div>
</body>
</html>
