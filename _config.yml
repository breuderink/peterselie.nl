# GitHub Pages user site (repo breuderink.github.io): the site serves at
# the domain root on peterselie.nl once the CNAME is active — the legacy
# Drupal URLs (/slug/, /files/...) must resolve there, so there is no
# baseurl. All links are root-absolute (menu/assets via relative_url,
# body links as authored, see DEPLOY.md).
url: "https://peterselie.nl"
baseurl: ""
repository: "breuderink/peterselie.nl"

# The ported content was authored for markdown-it (GFM, breaks: true):
# one newline in the file = one line on the page. Kramdown equivalents:
# input GFM, hard_wrap (single newline renders as <br>). Kramdown's smart
# typography is on by default and would rewrite the text (" -> curly,
# -- -> en dash, ... -> ellipsis); the old renderer emitted ASCII verbatim,
# so map quotes and typographic symbols back to ASCII (identity).
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true
  smart_quotes: [39, 39, 34, 34] # lsquo rsquo ldquo rdquo = ' ' " "
  typographic_symbols:
    hellip: '...'
    mdash: '---'
    ndash: '--'

# Allowed on GitHub Pages (no custom build step). Enables legacy Drupal
# URL mapping: add `redirect_from: ["/node/12", "/old-alias"]` to a page's
# front matter when an old node id or alias needs to reach it. The old
# alias set equals the new slugs 1:1, so nothing is mapped yet (2026-11-13
# probe, archive/live-2026-10-14b vs content permalinks).
plugins:
  - jekyll-redirect-from

# Dev-only and repo-doc files that must not reach the site output.
# LFS media exclusion lives in .jekyll-ignore (GitHub Pages honours it).
exclude:
  - archive/
  - build/
  - tools/
  - .pi/
  - .github/
  - Gemfile
  - Gemfile.lock
  - .jekyll-ignore
  - .gitattributes
  - .gitignore
  - DEPLOY.md
  - EDITING.md
  - README.md
  - STATE.md
  - LOG.md
  - LOG-*.md
  - KNOWLEDGE.md
  - TASKS.md
  - PLAN.md
  - TIMELINE.md
