# Push to main -> build/ -> GitHub Pages. One-time repo setting:
# Settings -> Pages -> Source: GitHub Actions. See DEPLOY.md.
# npm run build = eleventy + tools/check.py (stdlib link/asset gate).
# The oracle gate (tools/validate.py) is opt-in, for re-import days.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # files/* is Git LFS; checkout pulls it by default
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
